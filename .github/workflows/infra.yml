name: Infrastructure (Terraform)

on:
  workflow_dispatch:
    inputs:
      azure_client_id:
        description: "Azure Client ID (App ID du Service Principal)"
        required: true
      azure_tenant_id:
        description: "Azure Tenant ID"
        required: true
      azure_subscription_id:
        description: "Azure Subscription ID"
        required: true
      setting:
        description: "Setting (zone de déploiement)"
        required: true
        type: choice
        options: [NPR, PRD]
      location:
        description: "Azure Region"
        required: true
        default: "France Central"
        type: string
      domain:
        description: "Domaine MTA-STS (ex: contoso.com)"
        required: true
      policy_id:
        description: "ID de la policy MTA-STS (format: YYYYMMDDhh0000)"
        required: true
      policy_mode:
        description: "Mode de la policy"
        required: true
        default: "testing"
        type: choice
        options:
          - testing
          - enforce
      custom_domain_configured:
        description: "Custom domain CNAME configuré ?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      action:
        description: "Action Terraform"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy
          - force-unlock
      lock_id:
        description: "Lock ID à forcer (uniquement pour force-unlock)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.8.0"
  ARM_USE_OIDC: "true"

jobs:
  terraform:
    name: Terraform ${{ inputs.action == 'destroy' && 'Destroy' || 'Apply' }}
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ inputs.azure_client_id }}
      ARM_TENANT_ID: ${{ inputs.azure_tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
    defaults:
      run:
        working-directory: mta-sts-azure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ inputs.azure_client_id }}
          tenant-id: ${{ inputs.azure_tenant_id }}
          subscription-id: ${{ inputs.azure_subscription_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      - name: Terraform Validate
        if: inputs.action == 'apply'
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'apply'
        run: |
          terraform plan \
            -var="domain=${{ inputs.domain }}" \
            -var="setting=${{ inputs.setting }}" \
            -var="location=${{ inputs.location }}" \
            -var="policy_id=${{ inputs.policy_id }}" \
            -var="policy_mode=${{ inputs.policy_mode }}" \
            -var="custom_domain_configured=${{ inputs.custom_domain_configured }}" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Terraform Apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Export SWA Deployment Token to GitHub Secret
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          SWA_TOKEN=$(terraform output -raw swa_deployment_token)
          gh secret set AZURE_SWA_DEPLOYMENT_TOKEN \
            --body "$SWA_TOKEN" \
            --repo "${{ github.repository }}"
          echo "::notice::SWA deployment token updated in GitHub Secrets"

      - name: Print DNS Records
        if: inputs.action == 'apply'
        run: |
          echo "::notice::Vérifiez les enregistrements DNS à créer dans les outputs Terraform"
          terraform output -json dns_records_to_create || true
          echo ""
          echo "SWA Hostname (pour CNAME DNS) : $(terraform output -raw swa_default_hostname)"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          terraform destroy -auto-approve \
            -var="domain=${{ inputs.domain }}" \
            -var="setting=${{ inputs.setting }}" \
            -var="location=${{ inputs.location }}" \
            -var="policy_id=${{ inputs.policy_id }}" \
            -var="policy_mode=${{ inputs.policy_mode }}" \
            -var="custom_domain_configured=${{ inputs.custom_domain_configured }}"
      
      - name: Terraform Force Unlock
        if: inputs.action == 'force-unlock'
        run: terraform force-unlock -force ${{ inputs.lock_id }}

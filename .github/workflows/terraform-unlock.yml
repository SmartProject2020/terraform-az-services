name: Terraform - Force Unlock

on:
  workflow_dispatch:
    inputs:
      target_rg:
        description: "Resource Group cible (ex: EM50-NPR-ANSIB-DEV-RG01)"
        required: true

      lock_id:
        description: "Lock ID Terraform"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-22.04
    
    steps:

    # ============================================================
    # Safety check
    # ============================================================
    - name: "Safety check - Warning before unlock"
      run: |
        echo "::warning:: Vérifiez qu'aucune  instance terraform n'est en cours d'exécution avant unlock"

    # ============================================================
    # 1. Checkout
    # ============================================================
    - name: "1. Checkout repo"
      uses: actions/checkout@v4
      with:
        repository: SmartProject2020/terraform-az-services

    # ============================================================
    # 2. Routing dynamique
    # ============================================================
    - name: "2. Routing - Backend resolution"
      id: routing
      run: |
        set -euo pipefail

        RG="${{ inputs.target_rg }}"

        echo "Analyse du RG : $RG"

        PLAQUE=$(echo $RG | cut -d'-' -f1)
        SETTING=$(echo $RG | cut -d'-' -f2)
        ENV=$(echo $RG | cut -d'-' -f4)

        # Backend
        BACKEND_RG="${PLAQUE}-${SETTING}-INFRS-${SETTING}-RG01"
        STORAGE_ACCOUNT=$(echo "${PLAQUE}${SETTING}infrssta01" | tr '[:upper:]' '[:lower:]')

        if [ "$SETTING" == "PRD" ]; then
          CONTAINER="tfstate-prd"
        else
          CONTAINER="tfstate-$(echo $ENV | tr '[:upper:]' '[:lower:]')"
        fi

        KEY="${RG}.tfstate"

        # Subscription mapping
        case "$PLAQUE-$SETTING" in
          EM50-NPR)
            SUBSCRIPTION_ID="${{ vars.SUB_EM50_NPR }}"
            ;;
          EM50-PRD)
            SUBSCRIPTION_ID="${{ vars.SUB_EM50_PRD }}"
            ;;
          *)
            echo "::error::Mapping subscription inconnu"
            exit 1
            ;;
        esac

        # Secret OIDC
        SECRET_NAME="AZURE_CLIENT_ID_SC_OIDC_${PLAQUE}_${SETTING}"

        echo "backend_rg=$BACKEND_RG" >> $GITHUB_OUTPUT
        echo "storage_account=$STORAGE_ACCOUNT" >> $GITHUB_OUTPUT
        echo "container=$CONTAINER" >> $GITHUB_OUTPUT
        echo "key=$KEY" >> $GITHUB_OUTPUT
        echo "subscription_id=$SUBSCRIPTION_ID" >> $GITHUB_OUTPUT
        echo "secret_name=$SECRET_NAME" >> $GITHUB_OUTPUT

        echo "Backend résolu"

    # ============================================================
    # 3. Azure Login
    # ============================================================
    - name: "3. Azure Login (OIDC)"
      uses: azure/login@v2
      with:
        client-id:       ${{ secrets[steps.routing.outputs.secret_name] }}
        tenant-id:       ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ steps.routing.outputs.subscription_id }}

    # ============================================================
    # 4. Terraform setup
    # ============================================================
    - name: "4. Setup Terraform"
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.7.5"

    # ============================================================
    # 5. Terraform init
    # ============================================================
    - name: "5. Terraform Init"
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ secrets[steps.routing.outputs.secret_name] }}
        ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ steps.routing.outputs.subscription_id }}

      run: |
        terraform init -reconfigure \
          -backend-config="resource_group_name=${{ steps.routing.outputs.backend_rg }}" \
          -backend-config="storage_account_name=${{ steps.routing.outputs.storage_account }}" \
          -backend-config="container_name=${{ steps.routing.outputs.container }}" \
          -backend-config="key=${{ steps.routing.outputs.key }}"

    # ============================================================
    # 6. Force Unlock
    # ============================================================
    - name: "6. Terraform Force Unlock"
      env:
        ARM_USE_OIDC: "true"
        ARM_CLIENT_ID: ${{ secrets[steps.routing.outputs.secret_name] }}
        ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        ARM_SUBSCRIPTION_ID: ${{ steps.routing.outputs.subscription_id }}

      run: |
        echo "Unlock du state avec ID: ${{ inputs.lock_id }}"
        terraform force-unlock -force "${{ inputs.lock_id }}"

        echo "Unlock terminé avec succès" 